name: Workflow Evals

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  workflow-evals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run workflow evals
        run: |
          python tools/eval_workflows.py \
            --spec ai-evals/workflow-contracts.json \
            --threshold 1.0
