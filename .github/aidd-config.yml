# Optional repository-specific Harmonic Coding delivery configuration.
#
# Empty command arrays mean "discover the repository's command" rather than
# "skip the check". Do not store credentials, tokens, or other secrets here.
version: 1

delivery:
  artifacts:
    plan: docs/planning/backlog.md
    legacy_plan: plan.md
    repository_map: docs/planning/repo-map.md
    objective: vision.md
    scope: docs/specs/project-scope.md
    capability_map: docs/specs/capability-map.md
    phase_index: docs/planning/phases.md
    phase_directory: docs/planning/phases
    phase_open_directory: docs/planning/phases/open
    phase_closed_directory: docs/planning/phases/closed
    feature_index: docs/planning/features.md
    feature_directory: docs/planning/features
    feature_open_directory: docs/planning/features/open
    feature_closed_directory: docs/planning/features/closed
    backlog: docs/planning/backlog.md
    ticket_directory: docs/planning/tickets
    ticket_open_directory: docs/planning/tickets/open
    ticket_closed_directory: docs/planning/tickets/closed
    review_directory: docs/planning/reviews
    evidence_directory: evidence
    activity_log: activity-log.md
    agent_instructions: AGENTS.md
    project_readme: README.md

  planning:
    depth: auto # lightweight | standard | full | auto
    default_for_new_project: full
    canonical_vocabulary:
      objective: objective
      scope: scope
      capability: capability
      phase: phase
      feature: feature
      ticket: ticket
    id_prefixes:
      objective: OBJ
      scope: SCOPE
      capability: CAP
      phase: PHASE
      feature: FEAT
      ticket: TICKET
    statuses:
      draft: draft
      confirmed: confirmed
      needs_review: needs-review
      blocked: blocked
      complete: complete
    require_parent_approval: true
    preserve_ids_on_rename: true
    require_coverage_links: true
    active_phase_selection: highest-ranked-ready-ticket
    record_filename: "{id}-{slug}.md"
    move_records_on_status_change: true
    require_index_sync: true
    preserve_path_history: true
    status_directories:
      open:
        - draft
        - confirmed
        - needs-review
        - proposed
        - planned
        - active
        - pending
        - baseline
        - inProgress
        - verifying
        - gated
        - blocked
      closed:
        - complete
        - completed
        - cancelled

  approval:
    mode: user # user | review | repository
    before_child_planning: true
    before_ticket_execution: true
    before_next_ticket: true

  development:
    # Select once during project bootstrap. Guided preserves interactive
    # approvals and user functionality validation; automatic continues through
    # the configured workflow after bootstrap without asking or waiting.
    mode: guided # guided | automatic
    # Automatic mode uses this validator for every validation decision. The
    # deterministic command or analyzer remains the source of raw results.
    automatic_validation:
      validator: rubber-duck
      model: gpt-5.6-luna
      reasoning_effort: high
      scope: all-validation

  # Resolve this block after `delivery.development.mode`. It makes the
  # guided-versus-automatic precedence explicit for runtimes that do not
  # execute the prose contracts in the skills.
  mode_overrides:
    guided:
      approval:
        mode: user
        before_child_planning: true
        before_ticket_execution: true
        before_next_ticket: true
      version_control:
        commit:
          require_user_validation: true
          require_automatic_validation: false
        push:
          require_approval: true
      gates:
        user_validation_required: true
        automatic_validation_required: false
      static_analysis:
        remediation:
          require_approval: true
    automatic:
      approval:
        mode: bootstrap
        before_child_planning: false
        before_ticket_execution: false
        before_next_ticket: false
      version_control:
        commit:
          require_user_validation: false
          require_automatic_validation: true
        push:
          require_approval: false
      gates:
        user_validation_required: false
        automatic_validation_required: true
      static_analysis:
        remediation:
          require_approval: false

  repository:
    provider: auto # github | azure-devops | other | auto
    base_branch: null
    target_branch: null
    ticket_branch_pattern: "ticket/{ticket-slug}"

  version_control:
    dedicated_branch_required: true
    user_directive_override:
      enabled: true
      require_warning: true
      require_confirmation_when_gates_missing: true
      allow_stage_all_when_explicit: true
      record_bypassed_gates: true
      cannot_override:
        - secret-exposure
        - missing-credentials
        - missing-remote
        - provider-rejection
        - branch-protection-rejection
        - impossible-git-state
        - unrequested-destructive-operation
    commit:
      required_before_push: true
      require_review: true
      require_user_validation: true # guided mode; automatic uses automaticValidation
    push:
      enabled: true
      require_approval: true
      remote: null
      set_upstream: true
      allow_force: false
      require_clean_worktree: false

  commands:
    # All configured commands are agent-run technical checks. `functionality`
    # is the acceptance-boundary automation used before user validation.
    format: []
    lint: []
    type_check: []
    build: []
    smoke: []
    unit: []
    integration: []
    end_to_end: []
    functionality: []
    browser: []
    security: []
    coverage: []
    migration: []
    contract: []

  static_analysis:
    enabled: true
    run_on_review: true
    policy: auto # disabled | optional | required | auto
    default_mode: diff # diff | full
    deep_mode: full
    report_directory: evidence/static-analysis
    report_formats:
      - sarif
      - json
      - markdown
    baseline:
      enabled: true
      path: evidence/static-analysis/baseline.json
      gate_new_findings_only: true
      preserve_existing_findings: true
    parity:
      required: true
      compare_with_pr: true
      fail_on_mismatch: true
      source: ci-and-manifests
      compare:
        - commands
        - tool_versions
        - configuration
        - rules_or_profiles
        - include_exclude_scope
        - thresholds
        - baseline_or_reference
        - report_and_exit_policy
    remediation:
      mode: orchestrated # report | handoff | orchestrated
      require_approval: true
      max_iterations: 5
      scope: changed-or-new
      one_finding_per_fix: true
    tools:
      formatter:
        enabled: true
        required: auto
        command: []
        recommended: "prettier --check"
        check_only: true
      linter:
        enabled: true
        required: auto
        command: []
        recommended: "ESLint or the repository-native linter"
        check_only: true
      type_check:
        enabled: true
        required: auto
        command: []
        recommended: "tsc --noEmit or the repository-native type checker"
        check_only: true
      complexity:
        enabled: true
        required: auto
        command: []
        recommended: "language-native complexity rules or Lizard"
        check_only: true
      duplication:
        enabled: true
        required: auto
        command: []
        recommended: "jscpd"
        check_only: true
      dependencies:
        enabled: true
        required: auto
        command: []
        recommended: "dependency-cruiser for JavaScript/TypeScript"
        check_only: true
      security:
        enabled: true
        required: auto
        command: []
        recommended: "Semgrep Community or the repository-native SAST tool"
        check_only: true
      sonarqube:
        enabled: true
        required: optional
        command: []
        scanner_command: []
        recommended: "SonarQube Community Build with the matching SonarScanner"
        mode: deep
        check_only: true
      churn:
        enabled: true
        required: optional
        command: []
        recommended: "npx aidd churn --json"
        check_only: true

  gates:
    baseline_required: true
    user_validation_required: true # guided mode; automatic uses automaticValidation
    automatic_validation_required: true
    real_system_categories:
      - api
      - persistence
      - integration
      - user-facing
    local_quality_required: true
    automated_functionality_required: true
    remote_checks_required: true
    independent_review: false
    churn: optional # required | optional | disabled
    end_to_end_before_commit: null

  evidence:
    path: evidence
    filename: "{ticket-slug}.md"
    retention: until-pr-ready # until-pr-ready | branch | permanent
    include_environment: true
    include_artifacts: true
    redact_sensitive_values: true

  ui:
    before_after_required: true
    screenshot_directory: evidence/screenshots

  pull_request:
    required: auto # required | optional | disabled | auto
    reviewers: []
    merge_strategy: repository-default
    auto_merge: false
    poll_seconds: null
    require_approval: true
    provider_adapter: auto

  security:
    redact_secrets: true
    allow_credentials_in_config: false

  delegation:
    branch_strategy: isolated # isolated | shared | repository
    allow_shared_branch_push: false
    require_file_ownership: true
    integration_owner: orchestrator
    max_parallel: null
